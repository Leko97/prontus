<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — Prontus Admin</title>
  <link rel="stylesheet" href="/src/shared/css/variables.css">
  <link rel="stylesheet" href="/src/shared/css/reset.css">
  <link rel="stylesheet" href="/src/shared/css/components.css">
  <link rel="stylesheet" href="/src/admin/assets/css/admin.css">
</head>
<body>
  <div class="admin-layout">

    <aside id="sidebar" class="sidebar"></aside>

    <div class="admin-content">
      <header class="admin-topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
          <h1 class="topbar-title">Produtos</h1>
        </div>
        <div class="topbar-actions">
          <a href="/src/admin/pages/produto-form.html" class="btn btn-primary btn-sm">
            + Novo Produto
          </a>
        </div>
      </header>

      <main class="admin-main">

        <div class="page-header">
          <div class="page-header-left">
            <h1>Gerenciar Produtos</h1>
            <p>Cadastre e edite os itens do cardápio</p>
          </div>
          <a href="/src/admin/pages/produto-form.html" class="btn btn-primary">+ Novo Produto</a>
        </div>

        <div class="search-bar">
          <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="busca" placeholder="Buscar por nome ou categoria…">
          </div>
        </div>

        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Restrições</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="produtosTbody">
              <tr><td colspan="5" class="table-empty">
                <div class="spinner-center"><div class="spinner"></div></div>
              </td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <!-- Modal de exclusão -->
  <div id="modalExcluir" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Confirmar exclusão</h2>
        <button class="modal-close" data-close-modal>✕</button>
      </div>
      <p>Tem certeza que deseja excluir o produto <strong id="deleteNome"></strong>? Esta ação não pode ser desfeita.</p>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-close-modal>Cancelar</button>
        <button class="btn btn-danger" id="btnConfirmDelete">Excluir</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/admin/assets/js/produtos.js"></script>
</body>
</html>
